name: Update Homebrew Tap

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-homebrew-tap
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'potatoQi/LumaRing' && (github.event_name == 'workflow_dispatch' || !github.event.release.prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: potatoQi/homebrew-tap
          ref: main
          path: tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      - name: Verify release and update cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_homebrew.py tap/Casks/lumaring.rb
      - name: Check cask syntax
        run: ruby -c tap/Casks/lumaring.rb
      - name: Commit and push changes
        working-directory: tap
        run: |
          if git diff --quiet -- Casks/lumaring.rb; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/lumaring.rb
          git commit -m 'chore: update LumaRing cask'
          git pull --rebase origin main
          git push origin HEAD:main
