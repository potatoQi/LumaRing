name: Prepare Release draft
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check owner-selected version and required credentials
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          LUMARING_SIGN_IDENTITY: ${{ secrets.LUMARING_SIGN_IDENTITY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          python3 scripts/configure_bundle.py --verify-tag "$RELEASE_TAG"
          python3 scripts/check-release-inputs.py
          test -f "release-notes/$RELEASE_TAG.md"
      - name: Tests
        run: |
          swift test --disable-keychain --disable-netrc
          python3 -m unittest discover -s Tests/ReleaseTools -v
      - name: Install signing identity in an ephemeral keychain
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: bash scripts/ci-signing.sh
      - name: Build, notarize, sign and verify
        env:
          LUMARING_SIGN_IDENTITY: ${{ secrets.LUMARING_SIGN_IDENTITY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: bash scripts/prepare-release.sh
      - name: Create draft only
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          VERSION="$(python3 scripts/configure_bundle.py --print-version)"
          gh release create "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --verify-tag --draft \
            --title "LumaRing $RELEASE_TAG" --notes-file "release-notes/$RELEASE_TAG.md" \
            "dist/release-v$VERSION/LumaRing-$VERSION-macOS.zip" \
            "dist/release-v$VERSION/appcast.xml" "dist/release-v$VERSION/SHA256SUMS"
      - name: Remove ephemeral signing material
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/lumaring-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/lumaring-signing.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/lumaring-certificate.p12"
